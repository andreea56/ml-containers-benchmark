apiVersion: v1
kind: ServiceAccount
metadata:
  name: plots-waiter
  namespace: ml-experiments
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-status-reader
  namespace: ml-experiments
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plots-waiter-binding
  namespace: ml-experiments
subjects:
  - kind: ServiceAccount
    name: plots-waiter
    namespace: ml-experiments
roleRef:
  kind: Role
  name: job-status-reader
  apiGroup: rbac.authorization.k8s.io