apiVersion: batch/v1
kind: Job
metadata:
  name: sarsa-job
  namespace: ml-experiments
spec:
  completionMode: Indexed
  completions: 5
  parallelism: 3
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sarsa
          image: mlcontainersacrie2026.azurecr.io/reinforcement/sarsa:latest
          command: ["sh", "-c"]
          args:
            - |
              case $JOB_COMPLETION_INDEX in
                0) SEED=42 ;;
                1) SEED=123 ;;
                2) SEED=2024 ;;
                3) SEED=7 ;;
                4) SEED=99 ;;
              esac
              export SEED
              echo "Repetitie index $JOB_COMPLETION_INDEX -> SEED=$SEED"
              python reinforcement/sarsa_agent.py
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: output
              mountPath: /output
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: ml-output-pvc
