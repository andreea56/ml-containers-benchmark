apiVersion: batch/v1
kind: Job
metadata:
  name: svm-job
  namespace: ml-experiments
spec:
  completionMode: Indexed
  completions: 5
  parallelism: 3
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: svm
          image: mlcontainersacrie2026.azurecr.io/supervised/svm:latest
          command: ["sh", "-c"]
          args:
            - |
              case $JOB_COMPLETION_INDEX in
                0) SEED=42 ;;
                1) SEED=123 ;;
                2) SEED=2024 ;;
                3) SEED=7 ;;
                4) SEED=99 ;;
              esac
              export SEED
              echo "Repetitie index $JOB_COMPLETION_INDEX -> SEED=$SEED"
              python supervised/svm_model.py
          resources:
            requests:
              memory: "1Gi"
            limits:
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: output
              mountPath: /output
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ml-data-pvc
        - name: output
          persistentVolumeClaim:
            claimName: ml-output-pvc
---
